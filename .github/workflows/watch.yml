name: NeurIPS Sydney ticket watcher
on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 min (GitHub's minimum; runs can lag a bit)
    - cron: "0 3 1,15 * *"  # keepalive: twice a month
  workflow_dispatch:

permissions:
  contents: write           # only needed for the keepalive commit

concurrency:
  group: neurips-watch
  cancel-in-progress: false

jobs:
  check:
    if: github.event.schedule != '0 3 1,15 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python watch_neurips.py --once
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

  # GitHub disables scheduled workflows in public repos after 60 days with
  # no commits. This pushes a tiny commit twice a month to prevent that.
  keepalive:
    if: github.event.schedule == '0 3 1,15 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive" && git push
